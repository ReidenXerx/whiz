[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "whiz"
version = "0.11.5"
description = "A transcription CLI for meetings, screen recordings, and interviews — powered by whisper.cpp, with diarization, speaker naming, screenshots, HTML transcripts, and auto-detecting AI analysis (summary, action items, implementation plans)."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "ReidenXerx" }]
requires-python = ">=3.11"
keywords = ["whisper", "whisper.cpp", "speech-to-text", "transcription", "cli", "ffmpeg", "diarization", "speakers", "sherpa-onnx", "rich", "ollama", "ai-analysis", "implementation-plan"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = ["rich>=13"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/ReidenXerx/whiz"
Repository = "https://github.com/ReidenXerx/whiz"
Issues = "https://github.com/ReidenXerx/whiz/issues"

[project.scripts]
whiz = "whiz.cli:main"

[tool.setuptools]
packages = ["whiz"]